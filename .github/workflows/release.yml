name: Build Release Executables

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build all release targets
        run: zig build release

      - name: Prepare artifacts
        run: |
          mkdir -p release
          
          # Linux (static musl binaries)
          cp zig-out/x86_64-linux/litem8 release/litem8-linux-x86_64
          cp zig-out/aarch64-linux/litem8 release/litem8-linux-aarch64
          cp zig-out/arm-linux/litem8 release/litem8-linux-arm
          cp zig-out/riscv64-linux/litem8 release/litem8-linux-riscv64
          
          # macOS
          cp zig-out/x86_64-macos/litem8 release/litem8-macos-x86_64
          cp zig-out/aarch64-macos/litem8 release/litem8-macos-aarch64
          
          # Windows
          cp zig-out/x86_64-windows/litem8.exe release/litem8-windows-x86_64.exe
          cp zig-out/aarch64-windows/litem8.exe release/litem8-windows-aarch64.exe
          
          # Create checksums
          cd release
          sha256sum * > SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: release/

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: release

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
